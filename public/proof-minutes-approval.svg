  <rect x="688" y="288" width="240" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="710" cy="312" r="14" fill="#1d4ed8"/>
  <rect x="730" y="304" width="90" height="8" rx="2" fill="#e2e8f0"/>
  <rect x="730" y="316" width="60" height="6" rx="2" fill="#475569"/>
  <rect x="876" y="304" width="36" height="16" rx="8" fill="#334155"/>
  <rect x="882" y="308" width="24" height="8" rx="2" fill="#94a3b8"/>

  <!-- Approver 3 — pending -->
  <rect x="688" y="344" width="240" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="710" cy="368" r="14" fill="#7c3aed"/>
  <rect x="730" y="360" width="75" height="8" rx="2" fill="#e2e8f0"/>
  <rect x="730" y="372" width="50" height="6" rx="2" fill="#475569"/>
  <rect x="876" y="360" width="36" height="16" rx="8" fill="#334155"/>
  <rect x="882" y="364" width="24" height="8" rx="2" fill="#94a3b8"/>

