  <rect x="688" y="424" width="240" height="100" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="700" y="436" width="60" height="6" rx="2" fill="#4ade80"/>
  <rect x="770" y="436" width="100" height="6" rx="2" fill="#64748b"/>
  <rect x="700" y="452" width="55" height="6" rx="2" fill="#60a5fa"/>
  <rect x="765" y="452" width="110" height="6" rx="2" fill="#64748b"/>
  <rect x="700" y="468" width="70" height="6" rx="2" fill="#94a3b8"/>
  <rect x="780" y="468" width="100" height="6" rx="2" fill="#64748b"/>
  <rect x="700" y="484" width="65" height="6" rx="2" fill="#94a3b8"/>
  <rect x="775" y="484" width="95" height="6" rx="2" fill="#64748b"/>
  <rect x="700" y="500" width="80" height="6" rx="2" fill="#94a3b8"/>
  <rect x="790" y="500" width="85" height="6" rx="2" fill="#64748b"/>

