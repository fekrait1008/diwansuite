  <rect x="236" y="510" width="150" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="400" y="510" width="150" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Signature squiggles -->
  <path d="M248 528 Q265 520 278 528 Q291 536 304 528" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="414" y="523" width="100" height="1" fill="#334155"/>

