  <rect x="236" y="326" width="150" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="248" y="338" width="80" height="12" rx="2" fill="#94a3b8"/>
  <rect x="394" y="326" width="160" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="406" y="338" width="90" height="12" rx="2" fill="#94a3b8"/>
  <!-- Attendees -->
  <rect x="236" y="378" width="80" height="8" rx="2" fill="#94a3b8"/>
  <rect x="236" y="398" width="318" height="72" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="256" cy="426" r="14" fill="#1d4ed8"/>
  <rect x="276" y="420" width="70" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="276" y="432" width="50" height="6" rx="2" fill="#475569"/>
  <circle cx="256" cy="454" r="14" fill="#059669"/>
  <rect x="276" y="448" width="80" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="276" y="460" width="55" height="6" rx="2" fill="#475569"/>
  <!-- Agenda items -->
  <rect x="236" y="486" width="80" height="8" rx="2" fill="#94a3b8"/>
  <rect x="236" y="502" width="318" height="8" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="244" y="506" width="200" height="4" rx="1" fill="#475569"/>
  <rect x="236" y="518" width="318" height="8" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="244" y="522" width="160" height="4" rx="1" fill="#475569"/>

  <!-- Right: Progress tracker -->
  <rect x="584" y="178" width="360" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="600" y="194" width="130" height="10" rx="3" fill="#e2e8f0"/>
  <rect x="600" y="212" width="90" height="6" rx="2" fill="#475569"/>

  <!-- Vertical stage tracker -->
  <!-- Stage 1: Invitation — done -->
  <circle cx="628" cy="256" r="14" fill="#1d4ed8"/>
  <rect x="623" y="251" width="10" height="10" rx="1" fill="#bfdbfe"/>
  <rect x="650" y="250" width="100" height="8" rx="2" fill="#e2e8f0"/>
  <rect x="650" y="262" width="75" height="6" rx="2" fill="#475569"/>
  <rect x="628" y="270" width="1" height="36" fill="#334155"/>

  <!-- Stage 2: Agenda — done -->
  <circle cx="628" cy="312" r="14" fill="#1d4ed8"/>
  <rect x="623" y="307" width="10" height="10" rx="1" fill="#bfdbfe"/>
  <rect x="650" y="306" width="80" height="8" rx="2" fill="#e2e8f0"/>
