  <rect x="236" y="135" width="104" height="10" rx="2" fill="#bfdbfe"/>
  <rect x="356" y="135" width="90" height="10" rx="2" fill="#64748b"/>
  <rect x="458" y="135" width="95" height="10" rx="2" fill="#64748b"/>
  <rect x="562" y="135" width="80" height="10" rx="2" fill="#64748b"/>
  <rect x="652" y="135" width="88" height="10" rx="2" fill="#64748b"/>
  <rect x="750" y="135" width="80" height="10" rx="2" fill="#64748b"/>

