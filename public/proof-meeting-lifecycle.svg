  <rect x="12" y="72" width="176" height="36" rx="6" fill="#2563eb"/>
  <rect x="28" y="84" width="12" height="12" rx="2" fill="#bfdbfe"/>
  <rect x="48" y="86" width="70" height="8" rx="2" fill="#bfdbfe"/>
  <rect x="12" y="116" width="176" height="32" rx="6"/>
  <rect x="28" y="128" width="12" height="8" rx="2" fill="#64748b"/>
  <rect x="48" y="130" width="60" height="6" rx="2" fill="#64748b"/>
  <rect x="12" y="152" width="176" height="32" rx="6"/>
  <rect x="28" y="164" width="12" height="8" rx="2" fill="#64748b"/>
  <rect x="48" y="166" width="75" height="6" rx="2" fill="#64748b"/>
  <rect x="12" y="188" width="176" height="32" rx="6"/>
  <rect x="28" y="200" width="12" height="8" rx="2" fill="#64748b"/>
