  <!-- Left: meeting details form -->
  <rect x="220" y="178" width="350" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="236" y="194" width="140" height="10" rx="3" fill="#e2e8f0"/>
  <rect x="236" y="212" width="80" height="6" rx="2" fill="#475569"/>
