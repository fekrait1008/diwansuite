  <rect x="650" y="374" width="150" height="6" rx="2" fill="#60a5fa"/>
  <!-- Active indicator -->
  <rect x="800" y="360" width="52" height="18" rx="9" fill="#1d4ed8" opacity="0.3"/>
  <rect x="806" y="364" width="40" height="10" rx="4" fill="#60a5fa"/>
  <rect x="628" y="384" width="1" height="36" fill="#334155" opacity="0.4"/>

  <!-- Stage 4: Minutes — pending -->
  <circle cx="628" cy="426" r="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="624" y="422" width="8" height="8" rx="1" fill="#475569"/>
  <rect x="650" y="420" width="90" height="8" rx="2" fill="#64748b"/>
  <rect x="650" y="432" width="65" height="6" rx="2" fill="#334155"/>
  <rect x="628" y="440" width="1" height="36" fill="#334155" opacity="0.4"/>

  <!-- Stage 5: Approval — pending -->
  <circle cx="628" cy="482" r="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="624" y="478" width="8" height="8" rx="1" fill="#475569"/>
  <rect x="650" y="476" width="100" height="8" rx="2" fill="#64748b"/>
  <rect x="650" y="488" width="80" height="6" rx="2" fill="#334155"/>
  <rect x="628" y="496" width="1" height="36" fill="#334155" opacity="0.4"/>

  <!-- Stage 6: Archive — pending -->
  <circle cx="628" cy="538" r="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="624" y="534" width="8" height="8" rx="1" fill="#475569"/>
  <rect x="650" y="532" width="70" height="8" rx="2" fill="#64748b"/>
  <rect x="650" y="544" width="55" height="6" rx="2" fill="#334155"/>

  <!-- Bottom bar -->
  <rect x="220" y="572" width="724" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="236" y="584" width="80" height="24" rx="6" fill="#334155"/>
  <rect x="246" y="592" width="60" height="8" rx="2" fill="#94a3b8"/>
  <rect x="828" y="584" width="100" height="24" rx="6" fill="#1d4ed8"/>
  <rect x="840" y="592" width="76" height="8" rx="2" fill="#bfdbfe"/>
</svg>
